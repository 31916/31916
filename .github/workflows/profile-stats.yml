name: Update profile analytics

on:
  workflow_dispatch:
  schedule:
    # 12:17 Japan time. GitHub may delay scheduled jobs.
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: read

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify analytics calculations
        run: python3 -m unittest discover -s tests -v
      - name: Collect public GitHub data and render charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py --owner 31916 --output-dir assets/stats
      - name: Save refreshed charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/stats
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public profile analytics"
          git pull --rebase origin main
          git push origin HEAD:main

